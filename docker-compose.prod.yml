name: force-russian-proofing-4-pptx

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-force-russian-proofing4pptx:local}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      SERVER_NAME: ${SERVER_NAME}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      MAX_ZIP_ENTRIES: ${MAX_ZIP_ENTRIES:-10000}
      MAX_UNCOMPRESSED_BYTES: ${MAX_UNCOMPRESSED_BYTES:-524288000}
      MAX_COMPRESSION_RATIO: ${MAX_COMPRESSION_RATIO:-250}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,app}
      STATIC_DIR: /app/static
    expose:
      - "8000"
    networks:
      - proofing
    read_only: true
    tmpfs:
      - /tmp:size=${TMPFS_SIZE:-768m},mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/api/health', headers={'Host': os.getenv('SERVER_NAME', 'localhost')}); urllib.request.urlopen(req, timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-110m}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    networks:
      - proofing
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-check-certificate -qO- https://127.0.0.1/api/health --header='Host: ${SERVER_NAME}' >/dev/null || exit 1"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  proofing:
    driver: bridge
